# Eigenmietwert: gilt bis Steuerjahr 2028 (abgeschafft ab 1.1.2029). Quellen: reports/Eigenmietwert Berechnung nach Kanton.md
eigenmietwert:
  methode:
    text: "Theoretische Miete (loyer théorique) nach Fläche, Zimmerzahl, Ausstattung, Alter, Immissionen und Lage, gewichtet nach der Dauer der ununterbrochenen Nutzung; gedeckelt durch den «taux d’effort»."
    quelle: kb-ge
    artikel: "Art. 24 Abs. 2 LIPP"
  ziel:
    text: "kein fester Anteil der Marktmiete; höchstens 20 % der Bruttoeinkünfte"
    quelle: sm-eigenmietwert
  bundessteuer:
    abweichend: true
    text: "Laut Rundschreiben 172 gilt der Abschlag nach Besitzesdauer nicht für die Bundessteuer. Das Steuermäppchen 2025 meldet dagegen keine Abweichung."
    quelle: estv-rs-172
    ungeprueft: true
  unternutzung:
    moeglich: false
    quelle: sm-eigenmietwert
  haertefall:
    text: "Taux d’effort: Eigenmietwert höchstens 20 % der Bruttoeinkünfte, berechnet mindestens auf CHF 18 649 für Alleinstehende (doppelt bei Ehepaaren); nur, wenn die Finanzierungszinsen nicht höher sind."
    quelle: sm-eigenmietwert
    artikel: "Art. 24 Abs. 2 LIPP"
