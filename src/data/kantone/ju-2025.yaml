# Eigenmietwert: gilt bis Steuerjahr 2028 (abgeschafft ab 1.1.2029). Quellen: reports/Eigenmietwert Berechnung nach Kanton.md
eigenmietwert:
  methode:
    text: "Festlegung durch das Parlament (Arrêté) in Funktion der amtlichen Werte, «de manière modérée» gegenüber den Marktmieten."
    quelle: kb-ju
    artikel: "Art. 19 LI JU"
  ziel:
    text: "marktbezogen, eigentumsfördernd"
    quelle: sm-eigenmietwert
  bundessteuer:
    abweichend: true
    text: "Die lineare Senkung um 5 % gilt nicht für die Bundessteuer (Rundschreiben 172)."
    quelle: estv-rs-172
  unternutzung:
    moeglich: false
    quelle: sm-eigenmietwert
