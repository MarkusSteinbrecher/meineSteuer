# Eigenmietwert: gilt bis Steuerjahr 2028 (abgeschafft ab 1.1.2029). Quellen: reports/Eigenmietwert Berechnung nach Kanton.md
eigenmietwert:
  methode:
    text: "Amtlich geschätzter Mietwert nach Gemeindegruppen, festgesetzt auf einen festen Anteil der mittleren Marktmiete."
    quelle: kb-lu
    artikel: "§ 28 Abs. 2 StG LU"
  ziel:
    text: "70 % der mittleren Marktmiete"
    quelle: kb-lu
  bundessteuer:
    abweichend: false
    text: "Der kantonale Wert gilt auch für die Bundessteuer."
    quelle: sm-eigenmietwert
  unternutzung:
    moeglich: false
    quelle: sm-eigenmietwert
  haertefall:
    text: "Auf Antrag Herabsetzung, soweit der Mietwert 25 % der Einkünfte ohne Mietwert übersteigt und unter CHF 19’400 (Alleinstehende) bzw. CHF 27’200 (Verheiratete) liegt; mindestens 60 % der mittleren Marktmiete. Entfällt bei Vermögen über CHF 55’000 bzw. 110’000, ausser das Wohneigentum macht mehr als 75 % der Aktiven aus."
    quelle: kb-lu
    artikel: "§ 28 Abs. 4 StG LU, § 8b StV LU"
