# Eigenmietwert: gilt bis Steuerjahr 2028 (abgeschafft ab 1.1.2029). Quellen: reports/Eigenmietwert Berechnung nach Kanton.md
eigenmietwert:
  methode:
    text: "Statistischer Mietwert (Mietstatistik nach Fläche, Gebäudealter, Gemeinde, Typ, Komfort und Umgebung), indexiert; der Eigenmietwert ist ein fester Anteil davon."
    quelle: kb-vd
    artikel: "Art. 25 LI VD"
  ziel:
    text: "65 % des statistischen Mietwerts"
    quelle: kb-vd
  bundessteuer:
    abweichend: true
    text: "90 % des indexierten statistischen Mietwerts (Rundschreiben 172)."
    quelle: estv-rs-172
  unternutzung:
    moeglich: false
    quelle: sm-eigenmietwert
  haertefall:
    text: "Abzug für Wohnkosten (déduction pour le logement), auch für Mieter: Teil des Wohnwerts über 20 % des Reineinkommens, höchstens CHF 6 400; massgebender Wohnwert höchstens CHF 10 500 (Alleinstehende) bzw. 12 900 (Paare, Einelternfamilien), plus 3 500 pro Kind."
    quelle: sm-eigenmietwert
