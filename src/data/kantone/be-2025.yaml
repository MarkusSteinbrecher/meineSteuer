frist:
  datum: 2026-03-15
  text: 15. März 2026 (Selbständigerwerbende und Landwirte 15. Mai 2026)
  verlaengerung: "Über BE-Login (AGOV) unter «Fristverlängerung erfassen»: bis 15. Juli online gratis (sonst CHF 20), bis 15. September CHF 20 online (sonst CHF 40), bis 15. November höchstens CHF 40 online (sonst CHF 60); die Gebühren kommen auf die Schlussrechnung. Wegen eines Betriebsunterbruchs vom 23.10. bis 1.11.2026 gilt statt 15. November der 30. November 2026."
  quelle: be-fristverlaengerung
software:
  name: TaxMe-Online
  login: AGOV (BE-Login)
  quelle: be-taxme
ehepaare:
  modell: doppeltarif
  beschreibung: "Eigener, tieferer Tarif für Verheiratete. Persönlicher Abzug: 5300 für Alleinstehende, 7700 für Alleinerziehende und Alleinstehende mit eigenem Haushalt, 10'600 für Verheiratete."
  quelle: sm-ehepaare
# Eigenmietwert: gilt bis Steuerjahr 2028 (abgeschafft ab 1.1.2029). Quellen: reports/Eigenmietwert Berechnung nach Kanton.md
eigenmietwert:
  methode:
    text: "Protokollmietwert aus der amtlichen Bewertung × Mietwertfaktor der Gemeinde."
    quelle: sm-eigenmietwert
    artikel: "Art. 25 Abs. 4 StG BE"
  ziel:
    text: "60 % der Marktmiete"
    quelle: sm-eigenmietwert
  bundessteuer:
    abweichend: true
    text: "Eigener, höherer Mietwertfaktor je Gemeinde (laut Rundschreiben 172 rund 14,5 % über dem kantonalen). Für Liegenschaften, die nicht als Wohnsitz dienen, gilt dieser Wert auch kantonal."
    quelle: estv-rs-172
    ungeprueft: true
  unternutzung:
    moeglich: false
    quelle: sm-eigenmietwert
