# Eigenmietwert: gilt bis Steuerjahr 2028 (abgeschafft ab 1.1.2029). Quellen: reports/Eigenmietwert Berechnung nach Kanton.md
eigenmietwert:
  methode:
    text: "Einfamilienhaus und Stockwerkeigentum: fester Prozentsatz des Land- und Zeitbauwerts. Wohnung im eigenen Mehrfamilienhaus: Mieten im gleichen Haus, abzüglich 30 %."
    quelle: sm-eigenmietwert
    artikel: "Weisung des Regierungsrates ab Steuerperiode 2009 (LS 631.32), Ziff. 59–66"
  ziel:
    text: "höchstens 70 % der Marktmiete"
    quelle: sm-eigenmietwert
  bundessteuer:
    abweichend: false
    text: "Der kantonale Wert gilt auch für die Bundessteuer."
    quelle: sm-eigenmietwert
  unternutzung:
    moeglich: true
    quelle: sm-eigenmietwert
  haertefall:
    text: "Angemessener Einschlag, in der Regel wenn der Eigenmietwert mehr als einen Drittel der für die Lebenshaltung verfügbaren Einkünfte ausmacht; kein Einschlag bei steuerbarem Vermögen über CHF 600 000."
    quelle: sm-eigenmietwert
    artikel: "Weisung 2009, Ziff. 62"
