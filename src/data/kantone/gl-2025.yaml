  modell: splitting
  divisor: 1.7
  beschreibung: Teilsplitting für Verheiratete und Alleinerziehende mit Divisor 1,7.
  quelle: sm-ehepaare
fahrkosten_unbegrenzt: { quelle: sm-fahrkosten }
# Eigenmietwert: gilt bis Steuerjahr 2028 (abgeschafft ab 1.1.2029). Quellen: reports/Eigenmietwert Berechnung nach Kanton.md
eigenmietwert:
  methode:
    text: "Normmietwert nach örtlichem Mietpreisniveau und Objektmerkmalen (Grösse, Ausbau, Heizung, Baujahr, Lage u. a.); der Eigenmietwert ist ein fester Anteil davon. Ferien- und Weekendhäuser: voller Marktwert."
    quelle: kb-gl
    artikel: "Art. 21 Abs. 2 StG GL, Art. 18 und 24 VBG GL"
  ziel:
    text: "60 % der Marktmiete"
    quelle: kb-gl
  bundessteuer:
    abweichend: true
    text: "70 % statt 60 % des Marktwerts (Rundschreiben 172)."
    quelle: estv-rs-172
  unternutzung:
    moeglich: true
    quelle: sm-eigenmietwert
