frist:
  text: Auf dem persönlichen Formular aufgedruckt (Versand Ende Januar)
  verlaengerung: Online auf efristen.gl.ch/np mit PID und Geburtsdatum gebührenfrei bis 31. Dezember 2026; danach schriftlich, CHF 30. Nach der zweiten Mahnung keine Fristverlängerung mehr.
  quelle: gl-online-formulare
software:
  name: eTax.GL
  unterschriftsfrei: true
  login: Registrierung mit Zwei-Faktor-Authentifizierung
  quelle: gl-wegleitung-2025
