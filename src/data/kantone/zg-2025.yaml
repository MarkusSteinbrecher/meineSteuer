# Eigenmietwert: gilt bis Steuerjahr 2028 (abgeschafft ab 1.1.2029). Quellen: reports/Eigenmietwert Berechnung nach Kanton.md
eigenmietwert:
  methode:
    text: "Marktmiete als fester Prozentsatz des Verkehrswerts (ausser bei besonderen Verhältnissen oder aktueller Schätzung); der Eigenmietwert ist mindestens ein fester Anteil davon."
    quelle: kb-zg
    artikel: "§ 20 Abs. 2 StG ZG, § 6 StGV ZG"
  ziel:
    text: "mindestens 60 % der Marktmiete"
    quelle: kb-zg
  bundessteuer:
    abweichend: false
    text: "Der kantonale Wert gilt auch für die Bundessteuer."
    quelle: sm-eigenmietwert
  unternutzung:
    moeglich: true
    quelle: sm-eigenmietwert
    hinweis: "mindestens 5 Zimmer, Verzicht auf jede Nutzung, gesunkene Wohnbedürfnisse (§ 7 StGV ZG)"
