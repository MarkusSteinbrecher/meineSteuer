# Eigenmietwert: gilt bis Steuerjahr 2028 (abgeschafft ab 1.1.2029). Quellen: reports/Eigenmietwert Berechnung nach Kanton.md
eigenmietwert:
  methode:
    text: "Mietwertansatz in Prozent des Steuerwerts (Anhang zum Schätzungsreglement); für die Wohnung am Wohnsitz danach ein Abzug."
    quelle: kb-ur
    artikel: "Art. 26 StG UR, Art. 10 SchäR"
  ziel:
    text: "75 % der Marktmiete"
    quelle: sm-eigenmietwert
  bundessteuer:
    abweichend: false
    text: "Der kantonale Wert gilt auch für die Bundessteuer."
    quelle: sm-eigenmietwert
  unternutzung:
    moeglich: true
    quelle: sm-eigenmietwert
