    text: "Katasterschätzung bis CHF 240’000: fester Prozentsatz je Gemeindegruppe. Darüber (überdurchschnittliche Bauart): Einzelbewertung."
    quelle: kb-so
    artikel: "§ 28 StG SO, StV Nr. 15 §§ 1, 4–5"
  ziel:
    text: "60–90 % der Marktmiete"
    quelle: sm-eigenmietwert
  bundessteuer:
    abweichend: true
    text: "Bei Katasterschätzung bis CHF 240’000: 125 % des kantonalen Werts; darüber kein Zuschlag (Rundschreiben 172)."
    quelle: estv-rs-172
  unternutzung:
    moeglich: false
    quelle: sm-eigenmietwert
  tabelle:
    art: gruppen
    basis: Katasterschätzung (Gebäude und normaler Umschwung)
    bis: 240000
    quelle: kb-so
    artikel: StV Nr. 15 § 1
    gruppen:
      - { gruppe: I, satz: 10.63 }
      - { gruppe: II, satz: 10.02 }
      - { gruppe: III, satz: 9.42 }
      - { gruppe: IV, satz: 9.11 }
      - { gruppe: V, satz: 8.80 }
