# Eigenmietwert: gilt bis Steuerjahr 2028 (abgeschafft ab 1.1.2029). Quellen: reports/Eigenmietwert Berechnung nach Kanton.md
eigenmietwert:
  methode:
    text: "Einfamilienhaus und Stockwerkeigentum: Vermögenssteuerwert × Eigenmietwertsatz. Der Satz ist der hypothekarische Referenzzinssatz zu Beginn der Steuerperiode plus Zuschlag, mit Höchstsatz. Wohnung im eigenen Mehrfamilienhaus: Mieten vergleichbarer Wohnungen im Haus."
    quelle: kb-bs
    artikel: "§ 16 StV BS"
  ziel:
    text: "kein fester Anteil der Marktmiete; der Satz folgt dem Referenzzinssatz"
    quelle: sm-eigenmietwert
  bundessteuer:
    abweichend: true
    text: "Eigener Satz und Höchstbetrag für die Bundessteuer."
    quelle: kb-bs
  unternutzung:
    moeglich: false
    quelle: sm-eigenmietwert
