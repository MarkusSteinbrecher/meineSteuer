# Eigenmietwert: gilt bis Steuerjahr 2028 (abgeschafft ab 1.1.2029). Quellen: reports/Eigenmietwert Berechnung nach Kanton.md
eigenmietwert:
  methode:
    text: "Mietwert der letzten amtlichen Schätzung, plus 2,8 % nicht erfasster wertvermehrender Investitionen; für die Wohnung am Wohnsitz danach ein Abzug (nicht für Zweit- und Ferienwohnungen)."
    quelle: kb-ar
    artikel: "Art. 24 Abs. 2 StG AR, Art. 11 StV AR"
  ziel:
    text: "80 % der Marktmiete"
    quelle: sm-eigenmietwert
  bundessteuer:
    abweichend: false
    text: "Der kantonale Wert gilt auch für die Bundessteuer."
    quelle: sm-eigenmietwert
  unternutzung:
    moeglich: false
    quelle: sm-eigenmietwert
